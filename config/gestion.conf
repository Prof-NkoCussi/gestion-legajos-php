# config/gestion.conf: publica el sistema en http://IP-DEL-SERVIDOR/gestion/
# Se copia a /etc/apache2/conf-available/ y se activa con: sudo a2enconf gestion
# Apache sirve solo la carpeta public/: config/, src/, scripts/ y database/ quedan fuera de la web.

# Alias: la URL /gestion apunta a la carpeta public/ del repositorio
Alias /gestion /var/www/gestion-legajos-php/public

<Directory /var/www/gestion-legajos-php/public>
    # -Indexes: si falta el index.php, no muestra la lista de archivos
    Options -Indexes +FollowSymLinks
    # Sin archivos .htaccess: toda la configuración está acá
    AllowOverride None
    # Cualquiera de la red puede pedir estas páginas (quién entra lo decide el login)
    Require all granted
</Directory>
